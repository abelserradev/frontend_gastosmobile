<dialog
  #categoryDialog
  class="category-edit-dialog fixed inset-0 z-50 flex items-center justify-center p-4 m-0 w-full max-w-none h-full max-h-none bg-transparent border-0 shadow-none open:flex"
  (click)="onBackdropClick($event)"
  (keydown)="onDialogKeydown($event)"
  (close)="onNativeDialogClose()"
  aria-labelledby="edit-category-title"
>
  <div
    class="relative bg-card rounded-2xl p-6 w-full max-w-md shadow-2xl"
    (click)="stopBubble($event)"
  >
    <div class="flex items-start justify-between gap-3 mb-1">
      <h2 id="edit-category-title" class="text-xl font-bold text-foreground">
        Cambiar categoría
      </h2>
      <button
        type="button"
        (click)="handleCancel()"
        class="inline-flex items-center justify-center w-9 h-9 rounded-lg text-muted-foreground hover:text-foreground hover:bg-muted transition-colors shrink-0"
        aria-label="Cerrar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
    <p class="text-sm text-muted-foreground mb-4 truncate">
      {{ expenseTitle() }}
    </p>

    <form (ngSubmit)="handleSubmit()" class="space-y-4">
      <div>
        <label
          class="block text-sm font-medium text-foreground mb-1"
          for="edit-expense-category"
        >
          Categoría *
        </label>
        <input
          id="edit-expense-category"
          name="categoryName"
          type="text"
          [(ngModel)]="categoryName"
          list="edit-expense-category-suggestions"
          autocomplete="off"
          placeholder="Elige una existente o escribe una nueva"
          class="w-full px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-ring focus:border-transparent"
          required
        />
        <datalist id="edit-expense-category-suggestions">
          @for (cat of categories(); track cat.id) {
            <option [value]="cat.name"></option>
          }
        </datalist>
        @if (fieldError) {
          <p class="mt-1.5 text-xs text-destructive" role="alert">
            {{ fieldError }}
          </p>
        }
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="handleCancel()"
          class="flex-1 px-4 py-2 border border-border rounded-lg font-medium hover:bg-muted transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="flex-1 px-4 py-2 bg-primary text-primary-foreground rounded-lg font-medium hover:opacity-90 transition-colors"
        >
          Guardar
        </button>
      </div>
    </form>
  </div>
</dialog>
