server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Cloudflare/Coolify el esquema externo es https; evita Location: http://...
    absolute_redirect off;
    port_in_redirect off;

    location = /gastos-mobile.apk {
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="gastos-mobile.apk"';
        try_files $uri =404;
    }

    # SSG: servir index.html sin 301 a /ruta/ (canonical = sitemap, sin barra final)
    location ~ ^/(descargar|login|privacidad|terminos|cookies|aviso-legal)$ {
        try_files $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
