name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonar:
    name: SonarCloud (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar environments para tests (placeholders CI)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY || 'ci-placeholder-firebase-web-api-key' }}
          GASTOS_API_KEY: ${{ secrets.GASTOS_API_KEY || 'ci-placeholder-gastos-api-key' }}
        run: |
          node scripts/write-firebase-api-key.mjs
          node scripts/write-api-key.mjs

      - name: Tests con cobertura
        run: pnpm exec ng test --no-watch --code-coverage --browsers=ChromeHeadlessNoSandbox

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Aviso — configurar SONAR_TOKEN
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: |
          echo "::warning::SONAR_TOKEN no definido en GitHub Actions. Tests OK; escaneo SonarCloud omitido."
          echo "Pasos: docs/ci-sonarcloud.md (SonarCloud → token → secret SONAR_TOKEN en el repo)."
